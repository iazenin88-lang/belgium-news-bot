name: Test feedback loop

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python logic
        run: |
          python -m py_compile analyzer.py collector.py notifier.py editorial_feedback.py
          python -m unittest discover -s tests -v

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Telegram webhook
        run: |
          deno check supabase/functions/telegram-webhook/index.ts
